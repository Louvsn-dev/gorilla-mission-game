<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mission 800$ — Le jeu</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:#120f1d;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

body{
  display:grid;
  place-items:center;
}

.wrap{
  width:min(1180px,100vw);
  height:100vh;
  display:flex;
  flex-direction:column;
  padding:12px;
  gap:8px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.title{
  font-weight:900;
  letter-spacing:.4px;
}

.hud{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.pill{
  background:#241d32;
  border:1px solid #45375b;
  border-radius:999px;
  padding:7px 11px;
  font-weight:800;
  font-size:13px;
}

.bar{
  height:10px;
  background:#241d32;
  border-radius:99px;
  overflow:hidden;
  border:1px solid #45375b;
}

.fill{
  height:100%;
  width:0;
  background:#ffd43b;
  transition:width .2s;
}

.gamebox{
  position:relative;
  flex:1;
  min-height:0;
  border:2px solid #3f3153;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 20px 60px #0008;
  background:#8ed9ff;
}

.gamebox canvas{
  display:block;
  width:100%;
  height:100%;
}

.overlay{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:#09070bcc;
  backdrop-filter:blur(5px);
  z-index:5;
}

.card{
  width:min(720px,90%);
  background:#1d1729;
  border:2px solid #59456f;
  border-radius:22px;
  padding:26px;
  text-align:center;
  box-shadow:0 20px 80px #0009;
}

.card h1{
  margin:0 0 10px;
  font-size:clamp(28px,5vw,52px);
}

.card p{
  line-height:1.5;
  color:#ddd5e8;
}

.btn{
  border:0;
  border-radius:12px;
  padding:12px 18px;
  background:#ffd43b;
  color:#201807;
  font-weight:900;
  cursor:pointer;
}

.controls{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.ctrl{
  min-width:64px;
  height:48px;
  border:1px solid #514264;
  background:#241d32;
  color:#fff;
  border-radius:12px;
  font-size:18px;
  font-weight:900;
  touch-action:none;
}

.hint{
  text-align:center;
  font-size:12px;
  color:#bdb3c9;
}

.toast{
  position:absolute;
  left:50%;
  top:16px;
  transform:translateX(-50%);
  background:#17131fdd;
  border:1px solid #5c4a70;
  border-radius:999px;
  padding:8px 14px;
  font-weight:800;
  z-index:4;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
}

@media(max-width:700px){
  .wrap{
    padding:6px;
  }

  .pill{
    font-size:11px;
    padding:6px 9px;
  }

  .gamebox{
    border-radius:12px;
  }

  .hint{
    font-size:10px;
  }

  .ctrl{
    height:44px;
    min-width:58px;
  }
}
</style>
</head>

</div>

function resize(){

  const r = canvas.getBoundingClientRect();

  dpr = Math.min(devicePixelRatio || 1,2);

  W = Math.max(640,r.width);
  H = Math.max(360,r.height);

  canvas.width = Math.round(W*dpr);
  canvas.height = Math.round(H*dpr);

  ctx.setTransform(dpr,0,0,dpr,0,0);
}


new ResizeObserver(resize).observe(canvas);

resize();


function resetLevel(n){

  level = n;

  state.phase = 'play';

  state.collected.clear();

  state.eventCooldown = 0;

  particles = [];

  items = [];

  hazards = [];

  npcs = [];

  platforms = [];

  cameraX = 0;

  player.x = 90;
  player.y = 350;

  player.vx = 0;
  player.vy = 0;

  player.inv = 0;

  player.dir = 1;

  player.jumpLock = false;


  if(n === 1){

    setupLevel1();

  }else if(n === 2){

    setupLevel2();

  }else{

    setupLevel3();

  }


  updateHUD();

}


function addPlatform(x,y,w,h=24,type='ground'){

  platforms.push({
    x,
    y,
    w,
    h,
    type
  });

}


function addItem(x,y,type,id){

  items.push({

    x,
    y,

    w:type === 'cv' ? 30 : 24,

    h:type === 'cv' ? 18 : 24,

    type,

    id,

    got:false,

    bob:Math.random()*6

  });

}

/* =========================================================
   COLLISIONS
   ========================================================= */

function rectsOverlap(a,b){

  return (

    a.x < b.x+b.w &&

    a.x+a.w > b.x &&

    a.y < b.y+b.h &&

    a.y+a.h > b.y

  );

}


function solidCollision(ent){

  ent.onGround = false;


  for(const p of platforms){

    if(

      ent.x+ent.w > p.x &&

      ent.x < p.x+p.w &&

      ent.y+ent.h >= p.y &&

      ent.y+ent.h <= p.y+p.h+18 &&

      ent.vy >= 0

    ){

      ent.y = p.y-ent.h;

      ent.vy = 0;

      ent.onGround = true;

    }

  }


  if(ent.y+ent.h >= 470){

    ent.y = 470-ent.h;

    ent.vy = 0;

    ent.onGround = true;

  }

}


/* =========================================================
   JOUEUR
   ========================================================= */

function movePlayer(dt){

  if(state.phase !== 'play') return;


  const left =
    keys.has('ArrowLeft') ||
    keys.has('KeyA');


  const right =
    keys.has('ArrowRight') ||
    keys.has('KeyD');


  const jump =
    keys.has('Space') ||
    keys.has('ArrowUp') ||
    keys.has('KeyW');


  const accel = 2100;

  const max = 330;

  const fric = 1800;


  if(left){

    player.vx -= accel*dt;

    player.dir = -1;

  }


  if(right){

    player.vx += accel*dt;

    player.dir = 1;

  }


  if(!left && !right){

    if(Math.abs(player.vx)<fric*dt){

      player.vx=0;

    }else{

      player.vx -=
        Math.sign(player.vx)*fric*dt;

    }

  }


  player.vx =
    Math.max(
      -max,
      Math.min(max,player.vx)
    );


  if(
    jump &&
    player.onGround &&
    !player.jumpLock
  ){

    player.vy = -690;

    player.onGround = false;

    player.jumpLock = true;

    burst(
      player.x+player.w/2,
      player.y+player.h,
      8,
      'dust'
    );

  }


  if(!jump){

    player.jumpLock=false;

  }


  player.vy += 1800*dt;

  player.x += player.vx*dt;

  player.y += player.vy*dt;


  player.x =
    Math.max(
      0,
      Math.min(
        worldW-player.w,
        player.x
      )
    );


  solidCollision(player);


  player.anim +=
    dt*Math.min(
      12,
      Math.abs(player.vx)/35
    );


  if(player.inv>0){

    player.inv-=dt;

  }

}


/* =========================================================
   OBJETS
   ========================================================= */

function updateItems(dt){

  for(const it of items){

    it.bob += dt*4;

    if(it.got) continue;


    const b = {

      x:it.x-3,

      y:it.y+Math.sin(it.bob)*5,

      w:it.w+6,

      h:it.h+8

    };


    if(rectsOverlap(player,b)){

      it.got=true;

      state.collected.add(it.id);


      if(it.type==='cv'){

        state.cv++;

      }else{

        state.money += 40;

      }


      burst(

        it.x+it.w/2,

        it.y+it.h/2,

        14,

        it.type==='cv'
          ? '#fff'
          : '#ffd43b'

      );


      toast(
        it.type==='cv'
          ? 'CV récupéré !'
          : 'Billet récupéré !'
      );


      updateHUD();

    }

  }

}


/* =========================================================
   OBSTACLES
   ========================================================= */

function updateHazards(dt){

  for(const h of hazards){

    if(
      h.type==='car' ||
      h.type==='machine'
    ){

      h.x +=
        Math.sin(
          performance.now()/600+h.y
        )*.2;

    }


    if(
      rectsOverlap(player,h) &&
      player.inv<=0
    ){

      player.inv=1.2;

      state.lives--;

      player.vx =
        -player.dir*240;

      player.vy=-360;


      burst(
        player.x+player.w/2,
        player.y+player.h/2,
        18,
        '#ff5f6d'
      );


      toast(
        'Aïe ! Fais attention !'
      );


      if(state.lives<=0){

        gameOver();

      }


      updateHUD();

    }

  }

}


/* =========================================================
   PERSONNAGES SECONDAIRES
   ========================================================= */

function updateNPCs(dt){

  for(const n of npcs){

    n.anim =
      (n.anim||0)+dt*6;


    if(
      n.type==='person' ||
      n.type==='worker'
    ){

      n.x +=
        Math.sin(
          performance.now()/1000+n.walk
        )*12*dt;


      n.x =
        Math.max(
          30,
          Math.min(
            worldW-n.w-30,
            n.x
          )
        );

    }

  }

}


/* =========================================================
   HUD
   ========================================================= */

function updateHUD(){

  const progress =
    level===1
      ? state.cv/6
      : level===2
        ? (state.money-400)/400
        : 1;


  $('levelName').textContent =
    level===1
      ? 'NIVEAU 1 — RECHERCHE D’EMPLOI'
      : level===2
        ? 'NIVEAU 2 — LE CHANTIER'
        : 'NIVEAU 3 — LES 800$';


  $('money').textContent =
    state.money;


  $('target').textContent =
    level===1 ? 400 : 800;


  $('cvCount').textContent =
    state.cv;


  $('lives').textContent =
    state.lives;


  $('progress').style.width =
    Math.max(
      0,
      Math.min(
        100,
        progress*100
      )
    )+'%';

}


/* =========================================================
   PROGRESSION
   ========================================================= */

function checkProgress(){

  if(
    level===1 &&
    state.cv>=6 &&
    state.phase==='play'
  ){

    state.phase='transition';


    showOverlay(

      'NIVEAU 1 TERMINÉ 🎉',

      'Tous les CV sont récupérés. Une entreprise rappelle le gorille : direction le chantier !',

      'NIVEAU 2',

      ()=>{

        resetLevel(2);

        hideOverlay();

      }

    );

  }


  else if(
    level===2 &&
    state.money>=800 &&
    state.phase==='play'
  ){

    state.phase='transition';


    showOverlay(

      '800$ RÉUNIS 💰',

      'Après avoir bossé comme un malade sur le chantier, il a enfin l’argent. Maintenant, il doit le rendre.',

      'NIVEAU 3',

      ()=>{

        resetLevel(3);

        hideOverlay();

      }

    );

  }

}


function gameOver(){

  state.phase='over';


  showOverlay(

    'OUILLE. 😵',

    'Le gorille a pris trop de coups. Même un gorille a ses limites.',

    'RECOMMENCER',

    ()=>{

      resetLevel(level);

      hideOverlay();

    }

  );

}


function showOverlay(t,p,b,fn){

  $('overlayTitle').textContent=t;

  $('overlayText').textContent=p;

  $('overlayBtn').textContent=b;

  $('overlay').style.display='flex';

  $('overlayBtn').onclick=fn;

}


function hideOverlay(){

  $('overlay').style.display='none';

}


/* =========================================================
   MESSAGES
   ========================================================= */

function toast(s){

  const e=$('toast');

  e.textContent=s;

  e.classList.remove('show');

  void e.offsetWidth;

  e.classList.add('show');

  clearTimeout(toast.t);

  toast.t=setTimeout(
    ()=>e.classList.remove('show'),
    1200
  );

}


/* =========================================================
   PARTICULES
   ========================================================= */

function burst(x,y,n,color){

  for(let i=0;i<n;i++){

    particles.push({

      x,

      y,

      vx:(Math.random()-.5)*260,

      vy:(Math.random()-.8)*300,

      life:.5+Math.random()*.5,

      max:.8,

      color,

      size:3+Math.random()*5

    });

  }

}


function updateParticles(dt){

  for(const p of particles){

    p.life-=dt;

    p.vy+=600*dt;

    p.x+=p.vx*dt;

    p.y+=p.vy*dt;

  }


  particles =
    particles.filter(
      p=>p.life>0
    );

}


/* =========================================================
   DÉCOR
   ========================================================= */

function drawSky(){

  const g =
    ctx.createLinearGradient(
      0,0,0,H
    );


  if(level===1){

    g.addColorStop(
      0,
      '#63c9ff'
    );

    g.addColorStop(
      1,
      '#e6f7ff'
    );

  }

  else if(level===2){

    g.addColorStop(
      0,
      '#ffc77b'
    );

    g.addColorStop(
      1,
      '#ffe7bf'
    );

  }

  else{

    g.addColorStop(
      0,
      '#8fcbff'
    );

    g.addColorStop(
      1,
      '#ffe5f3'
    );

  }


  ctx.fillStyle=g;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

}


function drawCity(){

  for(const b of cityBuildings){

    const x =
      b.x-cameraX*.55;

    const y =
      470-b.h;


    if(
      x>W ||
      x+b.w<0
    ) continue;


    ctx.fillStyle =
      b.seed>.65
        ? '#8a6d9e'
        : '#657aa0';


    ctx.fillRect(
      x,
      y,
      b.w,
      b.h
    );


    for(
      let yy=y+18;
      yy<465;
      yy+=28
    ){

      for(
        let xx=x+12;
        xx<x+b.w-8;
        xx+=25
      ){

        ctx.fillStyle =
          (
            (Math.floor(xx)+
             Math.floor(yy))%3===0
          )
          ? '#ffe58a'
          : '#34435d';


        ctx.fillRect(
          xx,
          yy,
          10,
          13
        );

      }

    }

  }

}


function drawCloud(c){

  const x =
    c.x-cameraX*.25;

  const y=c.y;


  ctx.fillStyle='#ffffffcc';

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    18*c.s,
    0,
    Math.PI*2
  );

  ctx.arc(
    x+22*c.s,
    y-8*c.s,
    24*c.s,
    0,
    Math.PI*2
  );

  ctx.arc(
    x+48*c.s,
    y,
    17*c.s,
    0,
    Math.PI*2
  );

  ctx.fill();

}


function drawBackground(){

  drawSky();


  if(level===1){

    for(const c of clouds){

      drawCloud(c);

    }

    drawCity();

  }

  else{

    for(const c of clouds){

      drawCloud(c);

    }


    ctx.fillStyle =
      level===2
        ? '#d7b27a'
        : '#b5d68d';


    ctx.fillRect(
      0,
      420,
      W,
      80
    );

  }

}


/* =========================================================
   PLATEFORMES
   ========================================================= */

function drawPlatforms(){

  for(const p of platforms){

    const x =
      p.x-cameraX;


    if(
      x+p.w<0 ||
      x>W
    ) continue;


    ctx.fillStyle =
      p.type==='scaffold'
        ? '#8a5a2b'
        : p.type==='roof'
          ? '#4e526e'
          : p.type==='park'
            ? '#5eaa55'
            : '#4b7f49';


    ctx.fillRect(
      x,
      p.y,
      p.w,
      p.h
    );


    if(
      p.type==='scaffold'
    ){

      ctx.strokeStyle='#c77b35';

      ctx.lineWidth=5;

      ctx.strokeRect(
        x+4,
        p.y+4,
        p.w-8,
        p.h-8
      );


      for(
        let xx=x+20;
        xx<x+p.w;
        xx+=50
      ){

        ctx.beginPath();

        ctx.moveTo(
          xx,
          p.y
        );

        ctx.lineTo(
          xx,
          p.y+p.h
        );

        ctx.stroke();

      }

    }

  }

}

/* =========================================================
   OBSTACLES VISUELS
   ========================================================= */

function drawHazard(h){

  const x=h.x-cameraX;
  const y=h.y;


  if(h.type==='cone'){

    ctx.fillStyle='#ff7a45';

    ctx.beginPath();

    ctx.moveTo(
      x+h.w/2,
      y
    );

    ctx.lineTo(
      x+h.w,
      y+h.h
    );

    ctx.lineTo(
      x,
      y+h.h
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle='#fff';

    ctx.fillRect(
      x+8,
      y+h.h-14,
      h.w-16,
      5
    );

  }


  else if(h.type==='car'){

    ctx.fillStyle='#9b3d4d';

    ctx.fillRect(
      x,
      y+12,
      h.w,
      h.h-12
    );


    ctx.fillStyle='#6fbee9';

    ctx.fillRect(
      x+12,
      y+2,
      h.w-24,
      18
    );


    ctx.fillStyle='#151522';

    ctx.beginPath();

    ctx.arc(
      x+18,
      y+h.h,
      8,
      0,
      7
    );

    ctx.arc(
      x+h.w-18,
      y+h.h,
      8,
      0,
      7
    );

    ctx.fill();

  }


  else if(h.type==='barrel'){

    ctx.fillStyle='#a66a32';

    ctx.fillRect(
      x,
      y,
      h.w,
      h.h
    );


    ctx.strokeStyle='#6b3d1b';

    ctx.lineWidth=5;

    ctx.strokeRect(
      x+4,
      y+4,
      h.w-8,
      h.h-8
    );

  }


  else{

    ctx.fillStyle='#777';

    ctx.fillRect(
      x,
      y,
      h.w,
      h.h
    );


    ctx.fillStyle='#ffb000';

    ctx.fillRect(
      x+8,
      y+10,
      h.w-16,
      10
    );

  }

}

function limb(
  x1,
  y1,
  x2,
  y2,
  w=8,
  color='#333'
){

  ctx.strokeStyle=color;

  ctx.lineWidth=w;

  ctx.moveTo(
    x1,
    y1

  ctx.lineTo(
    x2,
    y2
  );

  ctx.stroke();

}

      n.y+34,

    );

    /* Casque */

    ctx.fillStyle='#ffd35c';

    ctx.fillRect(
      x+3,
      n.y-5,
      24,
      8
    );

    ctx.arc(
      x+15,

      0,

    );

    ctx.fillRect(
      x+5,

      35
    );


    limb(
      x+9,
      n.y+49,

    );

    limb(
      x+21,
      n.y+49,
      x+25,
      n.y+75,

    drawPrincess(

/* =========================================================
   JOUEUR À L'ÉCRAN
   ========================================================= */

function drawPlayer(){

  if(
    player.inv>0 &&
    Math.floor(player.inv*12)%2===0
  ) return;


  drawGorilla(
    player.x-cameraX,
    player.y,
    player.dir,
    player.anim
  );

}


/* =========================================================
   PARTICULES
   ========================================================= */

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha =
      Math.max(
        0,
        p.life/p.max
      );


    ctx.fillStyle=p.color;


    ctx.fillRect(
      p.x-cameraX,
      p.y,
      p.size,
      p.size
    );

  }


  ctx.globalAlpha=1;

}

   NIVEAU 3
   ========================================================= */

  if(level!==3) return;


  ctx.fillStyle='#fff';

  ctx.font='900 20px Arial';

  ctx.fillText(
    '800 $',
    760-cameraX,

  );

  );

}


/* =========================================================
   RENDU
   ========================================================= */

function draw(){

  drawBackground();

  drawPlatforms();


  for(const h of hazards){

    drawHazard(h);

  }


  for(const it of items){

    drawItem(it);

  }


  for(const n of npcs){

    drawNPC(n);

  }


  drawPlayer();

  drawParticles();

  drawLevel3Effects();

}


/* =========================================================
   CAMÉRA
   ========================================================= */

function cameraFollow(){

  const target =
    player.x-W*.35;


  const wanted =
    Math.max(
      0,
      Math.min(
        worldW-W,
        target
      )
    );


  cameraX +=
    (wanted-cameraX)*.12;

}


/* =========================================================
   ACTION E
   ========================================================= */

function action(){

  if(
    level===3 &&
    state.phase==='play'
  ){

    const pr =
      npcs.find(
        n=>n.type==='princess'
      );


    if(
      pr &&
      Math.abs(
        (player.x+player.w/2)-
        (pr.x+pr.w/2)
      )<120
    ){

      state.phase='ending';

      endingSequence();

    }

    else{

      toast(
        'Approche-toi de la princesse !'
      );

    }

  }

}

function endingSequence(){

  showOverlay(

    'MISSION ACCOMPLIE ❤️',

    'Le gorille arrive enfin avec les 800$. Il les rend à la princesse. La vieille photo se fissure… puis chacun reprend sa route.',

    ()=>{

      hideOverlay();

      runFinale();

    }

  );

}


function runFinale(){

  state.phase='finale';


  let t=0;

  const start=performance.now();


  function finale(now){

    t=(now-start)/1000;


    draw();


    ctx.save();


    ctx.fillStyle='#08060dcc';

    ctx.fillRect(
      0,
      0,
      W,
      H
    );


    ctx.translate(
      W/2,
      H/2

    /* ÉTAPE 1 : IL REND LES 800$ */

    if(t<2.5){

      ctx.fillStyle='#fff';

      ctx.font='900 34px Arial';

      ctx.textAlign='center';

      ctx.fillText(
        'IL REND LES 800$',
        0,
        -70
      );


      drawGorilla(
        -90,
        0,
        1,
        t*5
      );


      drawPrincess(
        45,
        0,
        -1,
        t*5
      );


      ctx.fillStyle='#74b44c';

      ctx.fillRect(
        -18,
        -30,
        36,
        22
      );


      ctx.fillStyle='#fff';

      ctx.font='bold 12px Arial';

      ctx.fillText(
        '$800',
        0,
        -14
      );

    }


    /* ÉTAPE 2 : PHOTO QUI SE CASSE */

    else if(t<5){

      ctx.fillStyle='#fff';

      ctx.font='900 38px Arial';

      ctx.textAlign='center';

      ctx.fillText(
        'CRAC.',
        0,
        -100
      );


      ctx.strokeStyle='#fff';

      ctx.lineWidth=4;


      ctx.beginPath();

      ctx.moveTo(
        -130,
        -150
      );

      ctx.lineTo(
        -20,
        -30
      );

      ctx.lineTo(
        -80,
        100
      );

      ctx.lineTo(
        15,
        20
      );

      ctx.lineTo(
        120,
        130
      );

      ctx.stroke();


      ctx.font='700 20px Arial';

      ctx.fillText(
        'La photo se casse.',
        0,
        155
      );

    }


    /* ÉTAPE 3 : CHACUN DE SON CÔTÉ */

    else{

      ctx.fillStyle='#fff';

      ctx.font='900 32px Arial';

      ctx.textAlign='center';

      ctx.fillText(
        'CHACUN REPREND SA ROUTE',
        0,
        -155
      );


      drawPrincess(
        -190,
        20,
        -1,
        t*4
      );


      drawKangarooM(
        -70,
        20,
        1,
        t*4
      );


      drawGorilla(
        70,
        20,
        1,
        t*4
      );


      drawKangarooF(
        190,
        20,
        -1,
        t*4
      );


      ctx.font='800 18px Arial';


      ctx.fillText(
        'Bonne continuation Redピt ✌️',
        0,
        155
      );

    }


    ctx.restore();


    if(t<8){

      requestAnimationFrame(
        finale
      );

    }

    else{

      state.phase='done';


      showOverlay(

        'FIN 🎬',

        'Les 800$ sont rendus. La photo est brisée. Le gorille et la princesse poursuivent chacun leur chemin… avec leurs nouveaux compagnons.',

        'REJOUER',

        ()=>{

          resetLevel(1);

          hideOverlay();

        }

      );

    }

  }


  requestAnimationFrame(
    finale
  );

}


/* =========================================================
   BOUCLE DU JEU
   ========================================================= */

function loop(now){

  const dt =
    Math.min(
      .033,
      (now-last)/1000 || .016
    );


  last=now;


  if(
    state.phase==='play'
  ){

    movePlayer(dt);

    updateItems(dt);

    updateHazards(dt);

    updateNPCs(dt);

    updateParticles(dt);

    cameraFollow();

    checkProgress();

  }

  else if(
    state.phase==='transition' ||
    state.phase==='over'
  ){

    updateParticles(dt);

  }


  draw();


  requestAnimationFrame(loop);

}


/* =========================================================
   CLAVIER
   ========================================================= */

window.addEventListener(
  'keydown',
  e=>{

    if(
      [
        'ArrowLeft',
        'ArrowRight',
        'ArrowUp',
        'Space',
        'KeyA',
        'KeyD',
        'KeyW',
        'KeyE'
      ].includes(e.code)
    ){

      e.preventDefault();

    }


    keys.add(e.code);


    if(
      e.code==='KeyE' &&
      !e.repeat
    ){

      action();

    }

  }
);


window.addEventListener(
  'keyup',
  e=>{

    keys.delete(e.code);

  }
);


/* =========================================================
   BOUTONS TACTILES
   ========================================================= */

document
  .querySelectorAll('.ctrl')
  .forEach(b=>{

    const k=b.dataset.key;


    b.addEventListener(
      'pointerdown',
      e=>{

        e.preventDefault();

        keys.add(k);


        if(k==='KeyE'){

          action();

        }

      }
    );


    [
      'pointerup',
      'pointercancel',
      'pointerleave'
    ].forEach(ev=>{

      b.addEventListener(
        ev,
        ()=>keys.delete(k)
      );

    });

  });


/* =========================================================
   DÉMARRAGE
   ========================================================= */

resetLevel(1);

requestAnimationFrame(loop);

</script>

</body>
</html>
