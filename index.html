<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mission 800$ — Manga City</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:#090b14;
  font-family:Inter,Arial,sans-serif;
  color:#fff;
  overflow:hidden
}
#wrap{
  width:100vw;
  height:100vh;
  display:grid;
  place-items:center;
  background:radial-gradient(circle at 50% 20%,#222a4c,#090b14 70%)
}
canvas{
  width:min(100vw,177.78vh);
  height:min(100vh,56.25vw);
  display:block;
  border-radius:18px;
  box-shadow:0 18px 70px #000b;
  touch-action:none
}
#hint{
  position:fixed;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
  opacity:.65;
  pointer-events:none
}
</style>
</head>

<body>

<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
</div>

<div id="hint">
←/→ ou A/D : courir · E : interaction · ESPACE/W : sauter · R : recommencer
</div>

<script>
'use strict';

const C=document.getElementById('game');
const ctx=C.getContext('2d');

const W=C.width;
const H=C.height;
const G=640;

const keys=new Set();

addEventListener('keydown',e=>{
  keys.add(e.key.toLowerCase());

  if([' ','arrowleft','arrowright','arrowup'].includes(e.key.toLowerCase())){
    e.preventDefault();
  }

  if(e.key.toLowerCase()==='r'){
    reset();
  }
});

addEventListener('keyup',e=>{
  keys.delete(e.key.toLowerCase());
});

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  ctx.fill();
}

function line(x1,y1,x2,y2,w,color){
  ctx.strokeStyle=color;
  ctx.lineWidth=w;
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();
}

function circle(x,y,r,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();
}

function text(s,x,y,size,color='#fff',align='left',weight='700'){
  ctx.font=`${weight} ${size}px Arial`;
  ctx.fillStyle=color;
  ctx.textAlign=align;
  ctx.textBaseline='middle';
  ctx.fillText(s,x,y);
}


/* =========================
   NIVEAU
========================= */

const platforms=[
  {x:0,y:640,w:1280,h:80},

  {x:150,y:525,w:190,h:18,label:'RECRUTEMENT'},

  {x:405,y:450,w:180,h:18,label:'CAFÉ • MODE • RESTO'},

  {x:655,y:510,w:205,h:18,label:'CONSTRUCTION'},

  {x:930,y:420,w:190,h:18,label:'BUREAUX'},

  {x:1045,y:565,w:120,h:18,label:'RH'}
];


/* =========================
   CV
========================= */

const cvSpots=[
  {x:205,y:488},
  {x:310,y:592},
  {x:445,y:413},
  {x:555,y:592},
  {x:700,y:473},
  {x:815,y:592},
  {x:955,y:383},
  {x:1100,y:528}
].map((p,i)=>({
  id:i,
  ...p,
  taken:false,
  bob:i*.7
}));


/* =========================
   PERSONNAGES
========================= */

const player={
  x:55,
  y:548,
  w:54,
  h:92,
  vx:0,
  vy:0,
  onGround:false,
  face:1,
  anim:0
};

const princess={
  x:1135,
  y:536,
  w:54,
  h:104,
  face:-1,
  anim:0
};

const kangarooF={
  x:335,
  y:545,
  w:60,
  h:95,
  vx:-.7,
  face:-1,
  anim:0
};

const kangarooM={
  x:870,
  y:545,
  w:70,
  h:95,
  vx:.65,
  face:1,
  anim:0
};


/* =========================
   OBSTACLES / ENNEMIS
========================= */

const enemies=[
  {
    x:570,
    y:585,
    w:42,
    h:55,
    vx:-1.1
  },
  {
    x:1020,
    y:585,
    w:42,
    h:55,
    vx:1.2
  }
];


/* =========================
   ETAT DU JEU
========================= */

let money=0;
let missionDone=false;
let scene='game';

let finishTimer=0;
let flash=0;
let photoT=0;
let tearT=0;

let toast='Récupère les 8 CV. Chaque CV vaut 100 $.';
let toastT=4;


/* =========================
   RESET
========================= */

function reset(){

  money=0;
  missionDone=false;
  scene='game';

  finishTimer=0;
  photoT=0;
  tearT=0;
  flash=0;

  player.x=55;
  player.y=548;
  player.vx=0;
  player.vy=0;

  cvSpots.forEach(c=>{
    c.taken=false;
  });

  toast='Récupère les 8 CV. Chaque CV vaut 100 $.';
  toastT=4;
}


function say(s){
  toast=s;
  toastT=2.8;
}


/* =========================
   COLLISIONS
========================= */

function collideWorld(){

  player.onGround=false;

  for(const p of platforms){

    if(
      player.x+player.w>p.x &&
      player.x<p.x+p.w
    ){

      const bottom=player.y+player.h;

      if(
        player.vy>=0 &&
        bottom<=p.y+22 &&
        bottom+player.vy>=p.y
      ){

        player.y=p.y-player.h;
        player.vy=0;
        player.onGround=true;
      }
    }
  }

  if(player.y+player.h>G){

    player.y=G-player.h;
    player.vy=0;
    player.onGround=true;
  }
}


/* =========================
   UPDATE
========================= */

function update(dt){

  /* SCENE PHOTO */

  if(scene==='photo'){
    photoT+=dt;
    tearT=Math.max(0,photoT-1.8);
    return;
  }


  /* SCENE FIN */

  if(scene==='complete'){

    finishTimer+=dt;

    if(finishTimer>2.5){
      scene='photo';
    }

    return;
  }


  /* =========================
     CONTROLES
  ========================= */

  const left=
    keys.has('arrowleft') ||
    keys.has('a');

  const right=
    keys.has('arrowright') ||
    keys.has('d');

  const jump=
    keys.has(' ') ||
    keys.has('w') ||
    keys.has('arrowup');


  const accel=
    left ? -1 :
    right ? 1 :
    0;


  player.vx=
    lerp(
      player.vx,
      accel*5.8,
      Math.min(1,dt*12)
    );


  if(accel){
    player.face=accel;
  }


  /* SAUT */

  if(jump && player.onGround){

    player.vy=-13.2;
    player.onGround=false;

    keys.delete(' ');
    keys.delete('w');
    keys.delete('arrowup');
  }


  /* GRAVITE */

  player.vy+=30*dt;

  player.x+=player.vx;
  player.y+=player.vy*dt;

  player.x=
    clamp(
      player.x,
      0,
      W-player.w
    );

  collideWorld();


  player.anim+=
    dt*(Math.abs(player.vx)*.65+1);


  /* =========================
     KANGOUROUS
  ========================= */

  kangarooF.x+=kangarooF.vx;
  kangarooM.x+=kangarooM.vx;


  if(
    kangarooF.x<300 ||
    kangarooF.x>365
  ){
    kangarooF.vx*=-1;
  }


  if(
    kangarooM.x<825 ||
    kangarooM.x>900
  ){
    kangarooM.vx*=-1;
  }


  kangarooF.anim+=dt*4;
  kangarooM.anim+=dt*4;
  princess.anim+=dt*2;


  /* =========================
     ENNEMIS
  ========================= */

  for(const e of enemies){

    e.x+=e.vx;

    if(
      e.x<520 ||
      e.x>610
    ){
      e.vx*=-1;
    }
  }


  /* =========================
     RECUPERATION DES CV
  ========================= */

  for(const c of cvSpots){

    if(
      !c.taken &&
      player.x+player.w>c.x-18 &&
      player.x<c.x+18 &&
      player.y+player.h>c.y-35 &&
      player.y<c.y+20
    ){

      c.taken=true;

      money+=100;

      flash=.12;

      say(
        `CV récupéré : +100 $  •  ${money} / 800 $`
      );
    }
  }


  /* =========================
     DON DES 800 $
  ========================= */

  if(
    money===800 &&
    !missionDone
  ){

    const nearPrincess=
      Math.abs(
        (player.x+player.w/2) -
        (princess.x+princess.w/2)
      )<72
      &&
      Math.abs(
        (player.y+player.h) -
        (princess.y+princess.h)
      )<70;


    if(
      nearPrincess &&
      keys.has('e')
    ){

      keys.delete('e');

      money=0;

      missionDone=true;

      scene='complete';

      finishTimer=0;

      say(
        'Mission validée ! Les 800 $ sont remis à la princesse.'
      );
    }
  }


  if(toastT>0){
    toastT-=dt;
  }

  if(flash>0){
    flash-=dt;
  }
}


/* =========================
   CIEL
========================= */

function drawSky(){

  const g=
    ctx.createLinearGradient(
      0,0,0,H
    );

  g.addColorStop(
    0,
    '#74d8ff'
  );

  g.addColorStop(
    .65,
    '#d9f3ff'
  );

  g.addColorStop(
    1,
    '#f6d6bd'
  );

  ctx.fillStyle=g;

  ctx.fillRect(
    0,0,W,H
  );


  circle(
    1110,
    92,
    48,
    '#ffd34e'
  );

  circle(
    1110,
    92,
    58,
    'rgba(255,211,78,.12)'
  );


  for(
    const [x,y,s]
    of [
      [170,105,1],
      [470,145,.8],
      [810,95,1.2],
      [1010,180,.75]
    ]
  ){

    circle(
      x,
      y,
      20*s,
      '#fff'
    );

    circle(
      x+25*s,
      y-4*s,
      27*s,
      '#fff'
    );

    circle(
      x+52*s,
      y+4*s,
      18*s,
      '#fff'
    );
  }
}


/* =========================
   IMMEUBLES
========================= */

function building(
  x,
  y,
  w,
  h,
  seed,
  label
){

  ctx.fillStyle=
    seed%2
      ? '#34456b'
      : '#40527b';

  ctx.fillRect(
    x,
    y,
    w,
    h
  );


  ctx.fillStyle='#263552';

  ctx.fillRect(
    x,
    y,
    w,
    9
  );


  for(
    let yy=y+30;
    yy<y+h-12;
    yy+=32
  ){

    for(
      let xx=x+18;
      xx<x+w-15;
      xx+=34
    ){

      ctx.fillStyle=
        ((xx+yy+seed)%3===0)
          ? '#ffd96a'
          : '#dcecf0';

      ctx.fillRect(
        xx,
        yy,
        16,
        19
      );
    }
  }


  text(
    label,
    x+w/2,
    y+18,
    12,
    '#fff',
    'center',
    '900'
  );
}


/* =========================
   VILLE
========================= */

function drawCity(){

  building(
    0,
    270,
    170,
    370,
    1,
    'AGENCE'
  );

  building(
    180,
    235,
    210,
    405,
    2,
    'CAFÉ • MODE • RESTO'
  );

  building(
    410,
    180,
    190,
    460,
    3,
    'START-UP'
  );

  building(
    610,
    225,
    220,
    415,
    4,
    'CONSTRUCTION'
  );

  building(
    840,
    145,
    180,
    495,
    5,
    'BUREAUX'
  );

  building(
    1030,
    250,
    250,
    390,
    6,
    'RH'
  );


  /* ECHAFAUDAGES */

  ctx.strokeStyle='#ef9b38';
  ctx.lineWidth=7;

  for(
    let x=650;
    x<=855;
    x+=55
  ){

    line(
      x,
      510,
      x,
      350,
      7,
      '#e7a13b'
    );
  }


  for(
    let y=360;
    y<=510;
    y+=50
  ){

    line(
      645,
      y,
      865,
      y,
      7,
      '#e7a13b'
    );
  }


  /* ROUTE */

  ctx.fillStyle='#263347';

  ctx.fillRect(
    0,
    640,
    W,
    80
  );


  ctx.fillStyle='#f4dc80';

  for(
    let x=20;
    x<W;
    x+=130
  ){

    ctx.fillRect(
      x,
      676,
      65,
      7
    );
  }


  /* VOITURES */

  for(
    const x
    of [100,740,1180]
  ){

    ctx.fillStyle='#df5b57';

    rr(
      x,
      613,
      70,
      24,
      7
    );

    ctx.fillStyle='#bfe6f1';

    ctx.fillRect(
      x+12,
      602,
      24,
      15
    );

    ctx.fillRect(
      x+42,
      602,
      16,
      15
    );

    circle(
      x+14,
      638,
      8,
      '#161c28'
    );

    circle(
      x+56,
      638,
      8,
      '#161c28'
    );
  }
}


/* =========================
   CV
========================= */

function drawCV(c){

  if(c.taken)return;

  const bob=
    Math.sin(
      performance.now()/260+c.bob
    )*5;

  const x=c.x;
  const y=c.y+bob;


  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.rotate(
    Math.sin(
      performance.now()/500+c.bob
    )*.03
  );


  ctx.shadowColor='#0005';
  ctx.shadowBlur=8;

  ctx.fillStyle='#fff9ea';

  rr(
    -24,
    -17,
    48,
    34,
    5
  );


  ctx.shadowBlur=0;

  ctx.strokeStyle='#d2b47b';
  ctx.lineWidth=2;

  ctx.strokeRect(
    -24,
    -17,
    48,
    34
  );


  ctx.fillStyle='#333';

  ctx.fillRect(
    -15,
    -9,
    8,
    8
  );


  ctx.fillStyle='#555';

  ctx.fillRect(
    -2,
    -8,
    17,
    3
  );

  ctx.fillRect(
    -2,
    -2,
    12,
    3
  );


  ctx.fillStyle='#d69d44';

  ctx.fillRect(
    -17,
    4,
    32,
    3
  );


  text(
    'CV',
    0,
    13,
    9,
    '#4a5568',
    'center',
    '900'
  );


  ctx.restore();
}


/* =========================
   MEMBRES
========================= */

function limb(
  x1,
  y1,
  x2,
  y2,
  w,
  skin,
  shadow
){

  line(
    x1,
    y1,
    x2,
    y2,
    w,
    shadow
  );

  line(
    x1,
    y1,
    x2,
    y2,
    w-5,
    skin
  );
}


function joint(
  x,
  y,
  r,
  skin
){

  circle(
    x,
    y,
    r,
    '#261d24'
  );

  circle(
    x,
    y,
    r-2,
    skin
  );
}


/* =========================
   PERSONNAGES HUMANOÏDES
========================= */

function drawHumanoid(
  x,
  y,
  opts
){

  const {
    type='gorilla',
    face=1,
    walk=0,
    scale=1
  }=opts;


  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.scale(
    scale,
    scale
  );


  const t=
    performance.now()/1000;


  const moving=
    Math.abs(walk)>0.1;


  const swing=
    moving
      ? Math.sin(t*10)*0.55
      : 0;


  const bob=
    moving
      ? Math.abs(
          Math.sin(t*10)
        )*2
      : 0;


  /* =========================
     PRINCESSE
  ========================= */

  if(type==='princess'){

    const skin='#d8a07d';
    const hair='#3a2030';
    const dress='#8d55d8';
    const light='#d99bf3';


    /* TETE */

    circle(
      0,
      -82+bob,
      25,
      skin
    );


    /* CHEVEUX */

    ctx.fillStyle=hair;

    ctx.beginPath();

    ctx.arc(
      -3,
      -88+bob,
      27,
      Math.PI,
      Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle=hair;

    ctx.beginPath();

    ctx.moveTo(
      -25,
      -88
    );

    ctx.quadraticCurveTo(
      -42,
      -60,
      -25,
      -35
    );

    ctx.quadraticCurveTo(
      -12,
      -55,
      -14,
      -78
    );

    ctx.fill();


    /* VISAGE */

    circle(
      -8,
      -82+bob,
      2.5,
      '#201722'
    );

    circle(
      8,
      -82+bob,
      2.5,
      '#201722'
    );

    line(
      -5,
      -70+bob,
      6,
      -70+bob,
      2,
      '#7c3f55'
    );


    /* ROBE */

    ctx.fillStyle=dress;

    ctx.beginPath();

    ctx.moveTo(
      -15,
      -57+bob
    );

    ctx.lineTo(
      15,
      -57+bob
    );

    ctx.lineTo(
      34,
      25
    );

    ctx.lineTo(
      -34,
      25
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle=light;

    ctx.beginPath();

    ctx.moveTo(
      -8,
      -58
    );

    ctx.lineTo(
      8,
      -58
    );

    ctx.lineTo(
      0,
      -5
    );

    ctx.closePath();

    ctx.fill();


    /* BRAS */

    limb(
      -13,
      -48,
      -32+Math.sin(t*3)*3,
      -15+bob,
      13,
      skin,
      '#4b2d35'
    );

    limb(
      13,
      -48,
      30,
      -17+bob,
      13,
      skin,
      '#4b2d35'
    );


    /* JAMBES */

    limb(
      -17,
      22,
      -18+10*swing,
      58,
      14,
      skin,
      '#4b2d35'
    );

    limb(
      17,
      22,
      18-10*swing,
      58,
      14,
      skin,
      '#4b2d35'
    );


    circle(
      -18+10*swing,
      61,
      7,
      '#4b2d35'
    );

    circle(
      18-10*swing,
      61,
      7,
      '#4b2d35'
    );


    /* COURONNE */

    ctx.fillStyle='#ffd34e';

    ctx.beginPath();

    ctx.moveTo(-15,-110);
    ctx.lineTo(-9,-94);
    ctx.lineTo(0,-103);
    ctx.lineTo(9,-94);
    ctx.lineTo(16,-110);
    ctx.lineTo(18,-93);
    ctx.lineTo(-18,-93);

    ctx.closePath();

    ctx.fill();
  }


  /* =========================
     GORILLE
  ========================= */

  else if(type==='gorilla'){

    const skin='#4d4654';
    const dark='#211c28';
    const muzzle='#8f7a72';


    /* TETE */

    circle(
      0,
      -80+bob,
      27,
      dark
    );

    circle(
      0,
      -77+bob,
      24,
      skin
    );


    /* OREILLES */

    circle(
      -18,
      -83+bob,
      9,
      dark
    );

    circle(
      18,
      -83+bob,
      9,
      dark
    );


    /* YEUX */

    circle(
      -9,
      -79+bob,
      4,
      '#f1d47b'
    );

    circle(
      9,
      -79+bob,
      4,
      '#f1d47b'
    );

    circle(
      -9,
      -79+bob,
      1.7,
      '#111'
    );

    circle(
      9,
      -79+bob,
      1.7,
      '#111'
    );


    /* MUSEAU */

    ctx.fillStyle=muzzle;

    ctx.beginPath();

    ctx.ellipse(
      0,
      -66+bob,
      15,
      11,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();


    circle(
      -5,
      -68+bob,
      2,
      '#222'
    );

    circle(
      5,
      -68+bob,
      2,
      '#222'
    );


    line(
      -6,
      -60+bob,
      7,
      -60+bob,
      2,
      '#222'
    );


    /* CORPS */

    ctx.fillStyle=skin;

    ctx.beginPath();

    ctx.moveTo(
      -27,
      -52+bob
    );

    ctx.quadraticCurveTo(
      -18,
      -25+bob,
      -20,
      15
    );

    ctx.lineTo(
      20,
      15
    );

    ctx.quadraticCurveTo(
      18,
      -25+bob,
      27,
      -52+bob
    );

    ctx.closePath();

    ctx.fill();


    /* BRAS LONGS */

    limb(
      -22,
      -47,
      -42+18*swing,
      10,
      25,
      skin,
      dark
    );

    limb(
      22,
      -47,
      42-18*swing,
      10,
      25,
      skin,
      dark
    );


    circle(
      -42+18*swing,
      14,
      13,
      skin
    );

    circle(
      42-18*swing,
      14,
      13,
      skin
    );


    /* JAMBES */

    limb(
      -12,
      12,
      -17-10*swing,
      58,
      20,
      skin,
      dark
    );

    limb(
      12,
      12,
      17+10*swing,
      58,
      20,
      skin,
      dark
    );


    circle(
      -17-10*swing,
      61,
      10,
      dark
    );

    circle(
      17+10*swing,
      61,
      10,
      dark
    );
  }


  /* =========================
     KANGOUROUS
  ========================= */

  else{

    const skin=
      type==='kangarooM'
        ? '#8a644c'
        : '#b27a54';

    const dark='#4b3027';
    const belly='#d8a678';


    /* TETE */

    circle(
      0,
      -79+bob,
      23,
      skin
    );


    /* OREILLES */

    ctx.fillStyle=skin;

    ctx.beginPath();

    ctx.moveTo(
      -16,
      -98
    );

    ctx.lineTo(
      -11,
      -132
    );

    ctx.lineTo(
      -2,
      -103
    );

    ctx.lineTo(
      7,
      -130
    );

    ctx.lineTo(
      15,
      -96
    );

    ctx.closePath();

    ctx.fill();


    /* YEUX */

    circle(
      -8,
      -80+bob,
      3,
      '#19131a'
    );

    circle(
      8,
      -80+bob,
      3,
      '#19131a'
    );


    line(
      -6,
      -68+bob,
      6,
      -68+bob,
      2,
      dark
    );


    /* CORPS */

    ctx.fillStyle=skin;

    ctx.beginPath();

    ctx.moveTo(
      -20,
      -56+bob
    );

    ctx.quadraticCurveTo(
      -35,
      -20+bob,
      -25,
      20
    );

    ctx.quadraticCurveTo(
      0,
      34+bob,
      25,
      20
    );

    ctx.quadraticCurveTo(
      35,
      -20+bob,
      20,
      -56+bob
    );

    ctx.closePath();

    ctx.fill();


    /* VENTRE */

    ctx.fillStyle=belly;

    ctx.beginPath();

    ctx.ellipse(
      0,
      -8+bob,
      16,
      27,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();


    /* BRAS */

    limb(
      -18,
      -48,
      -32+20*swing,
      -15+bob,
      13,
      skin,
      dark
    );

    limb(
      18,
      -48,
      32-20*swing,
      -15+bob,
      13,
      skin,
      dark
    );


    /* JAMBES */

    limb(
      -13,
      17,
      -20-10*swing,
      57,
      16,
      skin,
      dark
    );

    limb(
      13,
      17,
      20+10*swing,
      57,
      16,
      skin,
      dark
    );


    circle(
      -23-10*swing,
      60,
      9,
      dark
    );

    circle(
      23+10*swing,
      60,
      9,
      dark
    );


    /* QUEUE */

    ctx.strokeStyle=skin;
    ctx.lineWidth=12;
    ctx.lineCap='round';

    ctx.beginPath();

    ctx.moveTo(
      20,
      15
    );

    ctx.quadraticCurveTo(
      55,
      35,
      45,
      65
    );

    ctx.stroke();


    /* VERSION MUSCLE */

    if(type==='kangarooM'){

      ctx.fillStyle='#6c4a38';

      ctx.beginPath();

      ctx.moveTo(
        -25,
        -42
      );

      ctx.lineTo(
        0,
        -55
      );

      ctx.lineTo(
        25,
        -42
      );

      ctx.lineTo(
        18,
        -25
      );

      ctx.lineTo(
        -18,
        -25
      );

      ctx.closePath();

      ctx.fill();
    }
  }


  ctx.restore();
}


/* =========================
   ENNEMI
========================= */

function drawEnemy(e){

  const x=e.x;
  const y=e.y;

  ctx.save();

  ctx.translate(
    x,
    y
  );


  const s=
    Math.sin(
      performance.now()/180+x
    )*2;


  ctx.fillStyle='#22243a';

  rr(
    -20,
    -42,
    40,
    45,
    12
  );


  circle(
    0,
    -50,
    17,
    '#22243a'
  );


  circle(
    -6,
    -52,
    3,
    '#ffdf78'
  );

  circle(
    6,
    -52,
    3,
    '#ffdf78'
  );


  line(
    -5,
    -40,
    5,
    -40,
    2,
    '#e98a8a'
  );


  limb(
    -15,
    -35,
    -30+s,
    4,
    10,
    '#22243a',
    '#111522'
  );

  limb(
    15,
    -35,
    30-s,
    4,
    10,
    '#22243a',
    '#111522'
  );


  ctx.restore();
}


/* =========================
   HUD
========================= */

function drawHUD(){

  ctx.fillStyle='rgba(8,13,28,.86)';

  rr(
    22,
    18,
    330,
    92,
    18
  );


  text(
    'MISSION 800$ — NIVEAU 1',
    42,
    43,
    22,
    '#ffd66b'
  );


  text(
    `Récupère les CV : ${cvSpots.filter(c=>c.taken).length}/8`,
    42,
    76,
    18,
    '#fff'
  );


  ctx.fillStyle='rgba(8,13,28,.86)';

  rr(
    W-245,
    18,
    220,
    74,
    18
  );


  text(
    `$ ${money} / $800`,
    W-135,
    55,
    27,
    money===800
      ? '#7dff9b'
      : '#fff',
    'center',
    '900'
  );


  /* BARRE */

  const pct=money/800;

  ctx.fillStyle='#1e293b';

  rr(
    24,
    122,
    W-48,
    10,
    5
  );


  ctx.fillStyle='#6fe58c';

  rr(
    24,
    122,
    (W-48)*pct,
    10,
    5
  );


  /* MESSAGE */

  if(toastT>0){

    ctx.fillStyle='rgba(0,0,0,.75)';

    rr(
      W/2-310,
      H-72,
      620,
      42,
      15
    );


    text(
      toast,
      W/2,
      H-51,
      15,
      '#fff',
      'center',
      '700'
    );
  }


  /* PRINCESSE */

  if(
    money===800 &&
    !missionDone

    rr(
      princess.x-115,
      princess.y-58,
      230,
      38,
      14
    );


    text(
      'APPROCHE-TOI ET APPUIE SUR E',
      princess.x,
      princess.y-39,
      14,
      '#fff',
      'center',
      '900'
    );
  }
}


/* =========================
   RENDU DU NIVEAU
========================= */

function drawGame(){

  drawSky();

  drawCity();


  /* PLATEFORMES */

  for(
    const p
    of platforms.slice(1)
  ){

    ctx.fillStyle='#e9edf2';

    rr(
      p.x,
      p.y,
      p.w,
      p.h,
      7
    );


    ctx.fillStyle='#9aa6b8';

    ctx.fillRect(
      p.x,
      p.y+10,
      p.w,
      6
    );


    if(p.label){

      text(
        p.label,
        p.x+p.w/2,
        p.y-12,
        12,
        '#ffe17b',
        'center',
        '900'
      );
    }
  }


  /* CV */

  for(
    const c
    of cvSpots
  ){

    drawCV(c);
  }


  /* ENNEMIS */

  for(
    const e
    of enemies
  ){

    drawEnemy(e);
  }


  /* PERSONNAGES */

  drawHumanoid(
    player.x+player.w/2,
    player.y+player.h-10,
    {
      type:'gorilla',
      face:player.face,
      walk:player.vx,
      scale:1
    }
  );


  drawHumanoid(
    kangarooF.x,
    kangarooF.y+70,
    {
      type:'kangarooF',
      walk:kangarooF.vx,
      scale:1
    }
  );


  drawHumanoid(
    kangarooM.x,
    kangarooM.y+70,
    {
      type:'kangarooM',
      walk:kangarooM.vx,
      scale:1.05
    }
  );


  drawHumanoid(
    princess.x+princess.w/2,
    princess.y+78,
    {
      type:'princess',
      face:-1,
      walk:0,
      scale:1
    }
  );


  if(flash>0){

    ctx.fillStyle=
      `rgba(255,255,255,${flash*4})`;

    ctx.fillRect(
      0,
      0,
      W,
      H
    );
  }


  drawHUD();
}

  /* CADRE */

  ctx.fillStyle='#eee6d6';

  );

    ctx.lineTo(

    );

      '700'
    );
  }
}


/* =========================
   PETITS PERSONNAGES PHOTO
========================= */

function drawMiniPerson(
  x,
  y,
  shirt,
  skin,
  hair
){

  circle(
    x,
    y-65,
    24,
    skin
  );


  ctx.fillStyle=hair;

  ctx.beginPath();

  ctx.arc(
    x,
    y-70,
    26,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle=shirt;

  ctx.beginPath();

  ctx.moveTo(
    x-22,
    y-38
  );

  ctx.lineTo(
    x+22,
    y-38
  );

  ctx.lineTo(
    x+35,
    y+35
  );

  ctx.lineTo(
    x-35,
    y+35
  );

  ctx.closePath();

  ctx.fill();


  limb(
    x-15,
    y-35,
    x-32,
    y,
    12,
    skin,
    hair
  );

  limb(
    x+15,
    y-35,
    x+32,
    y,
    12,
    skin,
    hair
  );


  limb(
    x-13,
    y+30,
    x-17,
    y+70,
    14,
    skin,
    hair
  );

  limb(
    x+13,
    y+30,
    x+17,
    y+70,
    14,
    skin,
    hair
  );
}


/* =========================
   RENDU
========================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  if(
    scene==='game' ||
    scene==='complete'
  ){

    drawGame();

  }else{

    drawPhoto();
  }
}


/* =========================
   BOUCLE DU JEU
========================= */

let last=
  performance.now();


function loop(now){

  const dt=
    Math.min(
      .033,
      (now-last)/1000
    );

  last=now;

  update(dt);

  draw();

  requestAnimationFrame(loop);
}


requestAnimationFrame(loop);

</script>
